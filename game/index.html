<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPROUT SIEGE — grow the turrets, hold the gate: 3 gardens, 30 waves, 8 defenders, 7 pests, boss The Compost King</title>
<style>
  html, body { margin: 0; padding: 0; background: #101c0c; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #stage { position: relative; width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; }
  canvas { display: block; width: 1280px; height: 720px; background: #2e5d2a; cursor: pointer; }
  #msg {
    position: absolute; left: 0; right: 0; bottom: 2px; text-align: center;
    color: #d8e8c8; font-size: 12.5px; pointer-events: none; text-shadow: 0 1px 3px #000;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="msg">SPROUT SIEGE — plant with the mouse, Space starts the wave. Full HUD is drawn in-game.</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
